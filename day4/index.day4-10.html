<!DOCTYPE html>
<html>
<head>
    <title>My Class Timetable</title>

    <style>
        table {
            border: 1px solid black;
            width: 70%;
        }
        th {
            background-color: lightgray;
        }
        tr {
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #efefef;
        }
    </style>

</head>
<body>

    <h2>Weekly Timetable</h2>

    <table cellspacing="0" cellpadding="8">
        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>1:00 - 2:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Math</td>
            <td>English</td>
            <td>Science</td>
            <td>Computer</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Science</td>
            <td>Math</td>
            <td>History</td>
            <td>Sports</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>English</td>
            <td>Computer</td>
            <td>Math</td>
            <td>Art</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>History</td>
            <td>Science</td>
            <td>English</td>
            <td>Sports</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Computer</td>
            <td>Math</td>
            <td>Science</td>
            <td>Activity</td>
        </tr>
    </table>

</body>
</html>
